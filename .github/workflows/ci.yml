name: Python Flask + Selenium pytest CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Selenium Automation Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: library
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies (MySQL dev headers)
        run: |
          sudo apt-get update
          sudo apt-get install -y libmysqlclient-dev pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f tests/requirements-test.txt ]; then pip install -r tests/requirements-test.txt; fi

      - name: Initialize and seed database
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1/library
        run: |
          python tests/db_setup.py

      - name: Start Flask application in background
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1/library
          SECRET_KEY: ci_secret_key_only
        run: |
          python app.py &

      - name: Wait for Flask application to start
        run: |
          python -c "
          import urllib.request, time
          for i in range(15):
              try:
                  urllib.request.urlopen('http://127.0.0.1:5000')
                  print('Flask application is successfully running.')
                  exit(0)
              except Exception as e:
                  print(f'Waiting for Flask server (attempt {i+1}/15)... {e}')
                  time.sleep(1)
          exit(1)
          "

      - name: Run pytest Selenium test suite
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1/library
          GITHUB_ACTIONS: "true"
        run: |
          pytest
