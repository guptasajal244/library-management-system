[pytest]
# Root of test discovery
testpaths = tests

# Default output: verbose + short traceback
addopts = -v --tb=short

# Custom markers — prevents PytestUnknownMarkWarning
markers =
    smoke:  Quick sanity checks to verify the setup is working
    auth:   Login and logout flows for both roles
    admin:  Admin-only workflows (add book, add user, view reports)
    user:   User-only workflows (search, issue, return, place order)
    ajax:   Tests that involve browser alert dialogs (issue / return)
